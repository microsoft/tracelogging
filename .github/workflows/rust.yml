name: Rust

on:
  push:
    branches: [ "main" ]
    paths:
      - "etw/rust/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - "etw/rust/**"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

defaults:
  run:
    working-directory: ./etw/rust

jobs:
  windows-buildtest:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    - name: Setup Cache
      uses: actions/cache@v3
      with:
        path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Run dynamic release tests
      run: cargo test --release --verbose -p tracelogging_dynamic --test tests
    - name: Check kernel_mode build
      run: cargo clippy --verbose -p tracelogging -p tracelogging_dynamic --lib --features tracelogging_dynamic/kernel_mode -- -D warnings
