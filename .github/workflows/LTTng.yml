name: LTTng

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'etw/**'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'etw/**'
  schedule:
    - cron: '17 17 2,16 * *'

permissions:
  security-events: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        preset: ["Release", "Debug"]
    defaults:
      run:
        working-directory: ./LTTng

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Initialize CodeQL
      uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
      with:
        languages: cpp
    - name: Install deps
      run: sudo apt-get update && sudo apt-get install -y cmake liblttng-ust-dev

    - name: Configure CMake
      run: cmake --preset ${{matrix.preset}}

    - name: build
      run: cmake --build --preset ${{matrix.preset}}

    - name: test
      run: ctest --preset ${{matrix.preset}}

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
